# Reference this view as ra_development_analytics__delivery_tasks_fact
catalog: ra-development
schema: analytics
table_name: delivery_tasks_fact

dimensions:
  delivery_task_pk: {}
  delivery_project_fk: {}
  contact_fk: {}
  task_name: {}
  task_type: {}
  task_description: {}
  task_url: {}
  task_status: {}
  task_story_points: {}
  task_status_workflow_stage_number: {}
  task_status_colour: {}
  task_is_completed: {}
  task_status_change_ts: {}
  total_task_hours_to_complete: {}
  total_task_hours_incomplete: {}
  deliverable_type: {}
  deliverable_category: {}
  sprint_board_url: {}
  total_completed: {}
  total_in_progress: {}
  total_failed_client_qa: {}
  total_to_do: {}
  total_blocked: {}
  total_in_client_qa: {}
  total_in_qa: {}
  total_in_design: {}
  total_in_add_to_looker: {}
  total_in_looker_qa: {}
  total_revision_required: {}
  total_failed_internal_qa: {}
  total_delivery_tasks: {}
  total_delivery_subtasks: {}
  total_issues: {}
  last_task_start_ts: {}
  task_created_ts: {}
  task_last_modified_ts: {}
  is_latest_task_version: {}
  sprint_name: {}
  sprint_goal: {}
  task_start_ts: {}
  task_end_ts: {}
  task_completed_ts: {}
  epic_name: {}
  sprint_started_ts: {}
  task_work_started_ts: {}
  task_due_ts: {}
  total_completed_within_same_sprint: {}
  total_started_but_not_completed: {}

  _dbt_source_relation:
    hidden: true

  task_id:
    format: ID

  parent_task_id:
    format: ID

  project_id:
    format: ID

  task_creator_user_id:
    format: ID

  task_assignee_user_id:
    format: ID

  deliverable_id:
    format: ID

measures:
  count:
    aggregate_type: count

#The info below was pulled from your dbt repository and is read-only.
dbt:
  name: wh_delivery_tasks_fact
  target_schema: analytics
  config:
    materialized: table
    tags: [ warehouse ]
  code: |-
    {% if var("projects_warehouse_delivery_sources") %}
    {{
        config(
            unique_key='delivery_task_pk',
            alias='delivery_tasks_fact'
        )
    }}


    WITH tasks AS
      (
      SELECT {{ dbt_utils.star(from=ref('int_delivery_tasks')) }}
      FROM   {{ ref('int_delivery_tasks') }}
    ),
         projects AS
      (
        SELECT {{ dbt_utils.star(from=ref('wh_delivery_projects_dim')) }}
        FROM   {{ ref('wh_delivery_projects_dim') }}

      ),
      {% if target.type == 'bigquery' %}
        contacts_dim AS (
          SELECT
            {{ dbt_utils.star(
              from = ref('wh_contacts_dim')
            ) }}
          FROM
            {{ ref('wh_contacts_dim') }}
        )
        {% elif target.type == 'snowflake' %}
        contacts_dim as (
          SELECT
            c.contact_pk,
            cf.value::string as contact_id
          from {{ ref('wh_contacts_dim') }}
            c,table(flatten(c.all_contact_ids)) cf)
      {% else %}
        {{ exceptions.raise_compiler_error(
          target.type ~ " not supported in this project"
        ) }}
      {% endif %}
    SELECT
      {{ dbt_utils.generate_surrogate_key(['t.project_id','task_id','sprint_name']) }} as delivery_task_pk,
       p.delivery_project_pk as delivery_project_fk,
       u.contact_pk as contact_fk,
       t.*
    FROM
       tasks t
    {% if target.type == 'bigquery' %}
    JOIN
      contacts_dim u
    ON
      CAST(
         t.task_assignee_user_id  AS STRING
       ) IN unnest(
         u.all_contact_ids
       )
    {% elif target.type == 'snowflake' %}
    JOIN
      contacts_dim u
    ON
      t.task_assignee_user_id  :: STRING = u.contact_id
       {% else %}
    {{ exceptions.raise_compiler_error(
         target.type ~ " not supported in this project"
       ) }}
    {% endif %}
    LEFT OUTER JOIN
      projects p
    ON
      t.project_id = p.project_id
    {% else %}

       {{config(enabled=false)}}

    {% endif %}
  referenced_by:
    [
      wh_delivery_sprint_issue_history_fact,
      wh_engagement_context_attribution,
      wh_hr_utilization,
      wh_timesheet_project_engagement_rag_status_fact
    ]
