  code: |-
    {% if var("projects_warehouse_delivery_sources") %}

    with t_tasks_merge_list as
      (
        {{  merge_sources(sources=var('projects_warehouse_delivery_sources'),model_suffix='_tasks') }}
      )
    select *

     from t_tasks_merge_list

    {% else %} {{config(enabled=false)}} {% endif %}
  referenced_by: [ wh_delivery_tasks_fact ]
